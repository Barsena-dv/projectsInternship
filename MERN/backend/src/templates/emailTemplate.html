<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PostNFind Notification</title>
<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background-color:#f4f6f8;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.header{
    background:#4F46E5;
    color:white;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.content{
    padding:30px;
    color:#333;
    line-height:1.6;
}

.button{
    display:inline-block;
    padding:12px 20px;
    background:#4F46E5;
    color:white;
    text-decoration:none;
    border-radius:5px;
    margin-top:20px;
}

.footer{
    background:#f1f1f1;
    text-align:center;
    padding:15px;
    font-size:12px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
PostNFind
</div>

<div class="content">

<h2>Hello {{name}},</h2>

<p>
{{message}}
</p>

<a href="{{link}}" class="button">
View Details
</a>

<p style="margin-top:30px">
If you did not request this action, please ignore this email.
</p>

</div>

<div class="footer">
© 2026 PostNFind • Helping people reconnect with lost items
</div>

</div>

</body>
</html>
